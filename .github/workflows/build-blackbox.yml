      - uses: actions/setup-java@v4name: Build BlackBox APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Kaynak kodu indir (NewBlackbox, sabit surum)
        uses: actions/checkout@v4
        with:
          repository: ALEX5402/NewBlackbox
          ref: 89b59836c66f173756a4ae258cf379a957649820
      - name: GMS paketlerini klon listesine ekle (yama)
        run: |
          python3 - <<'PY'
          import re
          p='app/src/main/java/top/niunaijun/blackboxa/data/AppsRepository.kt'
          s=open(p).read()
          pat=r'if \(\(installedApplication\.flags and ApplicationInfo\.FLAG_SYSTEM\) != 0\)\s*continue'
          new='if ((installedApplication.flags and ApplicationInfo.FLAG_SYSTEM) != 0 && installedApplication.packageName !in setOf("com.google.android.gms", "com.google.android.gsf", "com.android.vending")) continue'
          s2,n=re.subn(pat,new,s,count=1)
          assert n==1, "yama uygulanamadi"
          open(p,'w').write(s2)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: NDK ve SDK paketleri
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;29.0.13846066" "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x ./gradlew
      - name: Debug APK derle
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: APK dosyalarini listele
        run: ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: BlackBox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
