name: Build BlackBox APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Kaynak kodu indir (NewBlackbox, sabit surum)
        uses: actions/checkout@v4
        with:
          repository: ALEX5402/NewBlackbox
          ref: 89b59836c66f173756a4ae258cf379a957649820
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: NDK ve SDK paketleri
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;29.0.13846066" "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x ./gradlew
      - name: Debug APK derle
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: APK dosyalarini listele
        run: ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: BlackBox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
